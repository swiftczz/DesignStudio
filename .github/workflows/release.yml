name: Release

# 推送 v* tag 时编译 DMG 并发布到 GitHub Releases；手动运行时只把 DMG 作为构建产物上传
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version without the leading v'
        required: true

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # Package.swift 需要 Swift 6.4 工具链：选用 runner 上最新的 Xcode
      - name: Select latest Xcode
        run: |
          latest=$(ls -d /Applications/Xcode*.app | sort -V | tail -n 1)
          echo "Using $latest"
          sudo xcode-select -s "$latest/Contents/Developer"
          swift --version

      - name: Derive version
        id: ver
        env:
          DISPATCH_VERSION: ${{ inputs.version }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            version="$DISPATCH_VERSION"
            is_tag=false
          else
            version="${GITHUB_REF_NAME#v}"
            is_tag=true
          fi
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Expected a version in MAJOR.MINOR.PATCH format." >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "is_tag=$is_tag" >> "$GITHUB_OUTPUT"

      - name: Run tests
        run: swift test

      - name: Generate changelog
        if: steps.ver.outputs.is_tag == 'true'
        run: |
          # 找上一个 tag（首次发版时为空）
          prev_tag=$(git describe --tags --abbrev=0 "${{ github.ref_name }}^" 2>/dev/null || echo "")
          ./Scripts/generate_changelog.sh "$prev_tag" "${{ github.ref_name }}" "${{ github.repository }}" > CHANGELOG.md
          cat >> CHANGELOG.md <<'NOTE'

          ## 安装

          1. 下载下方的 `DesignStudio-*.dmg`，打开后把 DesignStudio 拖到「应用程序」。
          2. 应用目前没有 Developer ID 签名。第一次打开如果被拦下，请到「系统设置 → 隐私与安全性」底部点「仍要打开」；
             或在终端运行 `xattr -dr com.apple.quarantine /Applications/DesignStudio.app`。

          系统要求：搭载 Apple 芯片的 Mac，运行 macOS 26 或更新版本。
          NOTE
          echo "=== changelog ==="
          cat CHANGELOG.md

      - name: Build DMG
        run: ./Scripts/release-dmg.sh "${{ steps.ver.outputs.version }}"

      - name: List DMG
        run: ls -lh "dist/DesignStudio-${{ steps.ver.outputs.version }}.dmg"

      - name: Generate signed appcast
        id: appcast
        if: steps.ver.outputs.is_tag == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          SPARKLE_PRIVATE_ED_KEY: ${{ secrets.SPARKLE_PRIVATE_ED_KEY }}
          TAG_FORCE_PUSHED: ${{ github.event.forced }}
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          dmg="dist/DesignStudio-${VERSION}.dmg"
          if [[ "$TAG_FORCE_PUSHED" == true || "$(gh release view "$GITHUB_REF_NAME" --json isDraft --jq .isDraft 2>/dev/null)" == false ]]; then
            # 已发布的更新源可能还在缓存里，保留旧下载地址，为新构建分配独立地址。
            build=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' build/DesignStudio.app/Contents/Info.plist)
            rebuilt="dist/DesignStudio-${VERSION}-build${build}.dmg"
            mv "$dmg" "$rebuilt"
            dmg="$rebuilt"
            printf '\n本次重新发布请下载 `%s`。\n' "$(basename "$dmg")" >> CHANGELOG.md
          fi
          bash Scripts/generate-appcast.sh "$dmg" CHANGELOG.md \
            "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/"
          echo "dmg=$dmg" >> "$GITHUB_OUTPUT"

      - name: Publish DMG and appcast
        if: steps.ver.outputs.is_tag == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          DMG: ${{ steps.appcast.outputs.dmg }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --json tagName >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "$DMG" --clobber
            gh release upload "$GITHUB_REF_NAME" dist/appcast.xml --clobber
            gh release edit "$GITHUB_REF_NAME" --draft=false --latest --notes-file CHANGELOG.md
          else
            gh release create "$GITHUB_REF_NAME" "$DMG" dist/appcast.xml --verify-tag --latest \
              --title "$GITHUB_REF_NAME" --notes-file CHANGELOG.md
          fi

      - name: Upload DMG as workflow artifact
        if: steps.ver.outputs.is_tag == 'false'
        uses: actions/upload-artifact@v7
        with:
          name: DesignStudio-${{ steps.ver.outputs.version }}
          path: dist/DesignStudio-${{ steps.ver.outputs.version }}.dmg
